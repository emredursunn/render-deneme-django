<!-- blog/templates/blog/post_list.html -->
<h1>Blog Posts</h1>
<ul>
    {% for post in posts %}
        <li>
            <a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a>
        </li>
    {% endfor %}
</ul>
<a href="{% url 'post_create' %}">New Post</a>
<a href="{% url 'chart_view' %}">Chart example PlotlyJS</a>
